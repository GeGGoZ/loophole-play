<title>LOOPHOLE</title>
<style>
:root {
  --bg: #07040f;
  --ink: #ffffff;
  --muted: rgba(255, 255, 255, 0.66);
  --cyan: #6fdcff;
  --pink: #ff5ce1;
  --gold: #ffe45c;
  --green: #7dffb0;
  --panel: rgba(18, 8, 40, 0.86);
  --line: rgba(190, 150, 255, 0.35);
  --font: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  overflow: hidden;
  font-family: var(--font);
  user-select: none;
  -webkit-user-select: none;
}

canvas#game { display: block; position: fixed; inset: 0; }
canvas#game.playing { cursor: none; }

#ui { position: fixed; inset: 0; pointer-events: none; }
#ui .screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  pointer-events: auto;
  padding: 16px; box-sizing: border-box;
  overflow-y: auto;
}
#ui .screen.dim { background: rgba(5, 2, 14, 0.72); backdrop-filter: blur(2px); }
#ui .screen.clear { background: radial-gradient(ellipse at center, rgba(5, 2, 14, 0.15), rgba(5, 2, 14, 0.65)); }

.logo {
  font-weight: 900; letter-spacing: 0.12em;
  font-size: clamp(48px, 10vw, 128px);
  line-height: 1;
  background: linear-gradient(90deg, #6fdcff, #ff5ce1 60%, #ffe45c);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 24px rgba(255, 92, 225, 0.45));
  margin: 0;
}
.tagline { color: var(--muted); font-size: clamp(14px, 2vw, 20px); margin: 10px 0 28px; letter-spacing: 0.04em; text-align: center; }

h2 { font-size: clamp(26px, 4vw, 44px); margin: 0 0 8px; letter-spacing: 0.06em; font-weight: 900; text-align: center; }
.sub { color: var(--muted); margin: 0 0 20px; text-align: center; max-width: 720px; }

.menu { display: flex; flex-direction: column; gap: 10px; min-width: min(320px, 90vw); }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

.btn {
  font: 800 18px var(--font); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink); background: rgba(255, 255, 255, 0.06);
  border: 2px solid var(--line); border-radius: 10px;
  padding: 12px 22px; cursor: pointer; outline: none;
  transition: transform 0.08s, background 0.12s, border-color 0.12s, box-shadow 0.12s;
}
.btn:hover, .btn.focus {
  background: rgba(111, 220, 255, 0.14); border-color: var(--cyan);
  box-shadow: 0 0 18px rgba(111, 220, 255, 0.35); transform: translateY(-1px) scale(1.02);
}
.btn.primary { border-color: var(--pink); background: rgba(255, 92, 225, 0.14); }
.btn.primary:hover, .btn.primary.focus { box-shadow: 0 0 22px rgba(255, 92, 225, 0.5); border-color: #ff9cf0; }
.btn:disabled { opacity: 0.35; cursor: default; }
.btn.small { font-size: 14px; padding: 8px 14px; }
/* Option groups (difficulty, mode): the chosen one is lit in its own colour (--c). */
.btn.opt { --c: var(--pink); }
.btn.opt.chosen { border-color: var(--c); color: var(--c); background: rgba(255, 255, 255, 0.12); box-shadow: 0 0 16px color-mix(in srgb, var(--c) 45%, transparent); }
.opts { margin-bottom: 6px; }
.opts + .sub { margin-bottom: 10px; }

/* Level-up draft */
.cards { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
.card {
  width: min(250px, 80vw); min-height: 250px; box-sizing: border-box;
  background: var(--panel); border: 2px solid var(--line); border-radius: 16px;
  padding: 18px 16px; display: flex; flex-direction: column; align-items: center; text-align: center;
  cursor: pointer; transition: transform 0.1s, box-shadow 0.12s, border-color 0.12s;
  animation: cardIn 0.25s ease-out both;
}
.card:nth-child(2) { animation-delay: 0.05s; }
.card:nth-child(3) { animation-delay: 0.1s; }
@keyframes cardIn { from { transform: translateY(24px) scale(0.92); opacity: 0; } }
.card:hover, .card.focus { transform: translateY(-6px) scale(1.03); border-color: var(--cyan); box-shadow: 0 0 28px rgba(111, 220, 255, 0.4); }
.card.rare { border-color: rgba(255, 92, 225, 0.6); }
.card.evolution { border-color: var(--gold); box-shadow: 0 0 34px rgba(255, 228, 92, 0.45); background: rgba(60, 40, 0, 0.85); }
.card .icon { font-size: 44px; line-height: 1.1; margin: 4px 0 8px; }
.card .name { font-weight: 900; font-size: 20px; letter-spacing: 0.05em; }
.card .lvl { color: var(--green); font-weight: 800; font-size: 13px; margin: 4px 0 10px; letter-spacing: 0.1em; }
.card.evolution .lvl { color: var(--gold); }
.card .desc { color: var(--muted); font-size: 15px; line-height: 1.35; }
.card .key { margin-top: auto; padding-top: 12px; color: rgba(255,255,255,0.4); font-size: 12px; font-weight: 800; }

/* Results */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; width: min(720px, 92vw); margin: 10px 0 20px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; }
.stat b { display: block; font-size: 26px; font-weight: 900; }
.stat span { color: var(--muted); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
.dust { color: var(--gold); font-weight: 900; font-size: 22px; margin-bottom: 14px; text-align: center; }
.unlock { color: var(--green); font-weight: 800; margin: 4px 0; }

/* Settings */
.settings { display: grid; grid-template-columns: 1fr auto; gap: 10px 18px; align-items: center; width: min(560px, 92vw); margin-bottom: 18px; }
.settings label { color: var(--muted); font-weight: 700; }
.settings .val { min-width: 170px; text-align: center; }

/* Grids for characters / shop / achievements */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; width: min(980px, 94vw); margin-bottom: 18px; }
.tile {
  background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 14px;
  text-align: left; color: var(--ink); font: inherit; cursor: pointer; outline: none;
}
.tile:hover, .tile.focus { border-color: var(--cyan); box-shadow: 0 0 18px rgba(111, 220, 255, 0.35); }
.tile.selected { border-color: var(--pink); box-shadow: 0 0 22px rgba(255, 92, 225, 0.45); }
.tile.locked { opacity: 0.55; }
.tile h3 { margin: 0 0 6px; font-size: 18px; letter-spacing: 0.05em; }
.tile p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.35; }
.tile .price { color: var(--gold); font-weight: 900; margin-top: 8px; display: block; }
.tile .pips { margin-top: 8px; display: flex; gap: 4px; }
.tile .pips i { width: 16px; height: 5px; background: rgba(255,255,255,0.15); border-radius: 3px; }
.tile .pips i.on { background: var(--green); }
.tile.done { border-color: rgba(125, 255, 176, 0.6); }

.topbar { position: absolute; top: 14px; right: 18px; color: var(--gold); font-weight: 900; font-size: 18px; }
.footer-hint { position: absolute; bottom: 12px; left: 16px; right: 16px; text-align: center; color: rgba(255,255,255,0.45); font-size: 13px; }
.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,0.08); color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: 0.08em; }
.toast {
  position: fixed; right: 22px; background: rgba(40, 30, 0, 0.92); border: 2px solid var(--gold);
  color: var(--ink); padding: 12px 16px; border-radius: 12px; font-weight: 800; pointer-events: none;
  animation: toastIn 0.3s ease-out both; z-index: 10;
}
@keyframes toastIn { from { transform: translateY(20px); opacity: 0; } }

/* ---------- Touch / iOS ---------- */
html, body {
  position: fixed; inset: 0;
  overscroll-behavior: none;            /* no pull-to-refresh / rubber-band */
  -webkit-touch-callout: none;          /* no long-press callout */
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  touch-action: none;
}
#ui .screen {
  touch-action: pan-y;                  /* menus can still scroll */
  -webkit-overflow-scrolling: touch;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px))
           max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.btn, .card, .tile { touch-action: manipulation; }
.topbar { top: calc(env(safe-area-inset-top, 0px) + 14px); right: calc(env(safe-area-inset-right, 0px) + 18px); }
.footer-hint { bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }
.card .body { display: flex; flex-direction: column; align-items: inherit; }

#touch-ui button {
  position: fixed; z-index: 5;
  color: #fff; font: 900 15px var(--font); letter-spacing: 0.1em;
  border: 2px solid rgba(111, 220, 255, 0.55); background: rgba(18, 8, 40, 0.55);
  -webkit-user-select: none; user-select: none; touch-action: none; outline: none;
}
#t-dash {
  right: calc(env(safe-area-inset-right, 0px) + 20px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  width: 88px; height: 88px; border-radius: 50%;
  background: conic-gradient(rgba(111, 220, 255, 0.45) calc(var(--p, 1) * 360deg), rgba(18, 8, 40, 0.55) 0);
}
#t-dash.ready { border-color: #bff6ff; box-shadow: 0 0 22px rgba(111, 220, 255, 0.55); }
#t-dash:active { transform: scale(0.94); }
#t-pause {
  left: calc(env(safe-area-inset-left, 0px) + 12px);
  top: calc(env(safe-area-inset-top, 0px) + 72px);
  width: 46px; height: 46px; border-radius: 12px; letter-spacing: 0.05em;
}

/* ---------- Small screens (phones, both orientations) ---------- */
@media (max-width: 720px), (max-height: 520px) {
  h2 { font-size: 24px; }
  .sub { font-size: 14px; margin-bottom: 12px; }
  .tagline { margin: 6px 0 18px; }
  .menu { gap: 8px; }
  .btn { font-size: 15px; padding: 11px 16px; }
  .cards { flex-direction: column; gap: 10px; width: min(560px, 100%); margin-top: 6px; }
  .card {
    width: 100%; min-height: 0; flex-direction: row; align-items: center; text-align: left;
    gap: 14px; padding: 12px 14px;
  }
  .card:hover, .card.focus { transform: none; }
  .card .icon { font-size: 30px; margin: 0; flex: none; width: 40px; text-align: center; }
  .card .body { align-items: flex-start; }
  .card .name { font-size: 17px; }
  .card .lvl { margin: 2px 0 4px; }
  .card .desc { font-size: 14px; }
  .card .key { display: none; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
  .tile { padding: 11px; }
  .stat b { font-size: 21px; }
  .dust { font-size: 18px; }
  .settings { gap: 8px 12px; }
  .settings .val { min-width: 130px; }
  .footer-hint { font-size: 12px; }
}
@media (max-height: 520px) and (orientation: landscape) {
  .logo { font-size: 44px; }
  .menu { flex-direction: row; flex-wrap: wrap; justify-content: center; max-width: 92vw; }
}
#touch-ui.left #t-dash { right: auto; left: calc(env(safe-area-inset-left, 0px) + 20px); }

/* Customize screen */
h3.section { margin: 6px 0 8px; font-size: 16px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); align-self: center; }
.grid.looks { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.tile.look { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }
.tile.look canvas.av { width: 72px; height: 72px; }
.tile.look .swatch { display: block; width: 100%; height: 18px; border-radius: 9px; margin: 10px 0 6px; box-shadow: 0 0 14px rgba(255, 255, 255, 0.15); }
.tile.look p { font-size: 13px; }

html, body { background: #07040f; color-scheme: dark; }
canvas#game { touch-action: none; }
</style>
